<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="'Leelawadee UI','Sarabun','Tahoma','Noto Sans Thai',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7a5c43" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbeecb"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd873"/>
      <stop offset="1" stop-color="#e8a71c"/>
    </linearGradient>
    <radialGradient id="pig" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffd6de"/>
      <stop offset="1" stop-color="#f8bcc8"/>
    </radialGradient>
  </defs>

  <!-- แผ่นป้าย -->
  <rect x="26" y="26" width="848" height="628" rx="48" fill="url(#plate)" stroke="#f0b429" stroke-width="9" filter="url(#soft)"/>
  <rect x="44" y="44" width="812" height="592" rx="34" fill="none" stroke="#f7dc9a" stroke-width="3"/>

  <!-- เหรียญมุม -->
  <g fill="url(#coin)" stroke="#d99a1b" stroke-width="3">
    <circle cx="92" cy="96" r="22"/><circle cx="808" cy="96" r="22"/>
  </g>
  <g fill="#a7791a" font-size="24" font-weight="800" text-anchor="middle">
    <text x="92" y="105">฿</text><text x="808" y="105">฿</text>
  </g>

  <!-- ประกาย -->
  <g fill="#ffcf4d">
    <path d="M250 150 l7 18 18 7 -18 7 -7 18 -7-18 -18-7 18-7z"/>
    <path d="M648 128 l5 13 13 5 -13 5 -5 13 -5-13 -13-5 13-5z"/>
  </g>

  <!-- ===== กระปุกหมูออมสิน ===== -->
  <g transform="translate(0,4)">
    <!-- เหรียญหยอด -->
    <circle cx="450" cy="95" r="30" fill="url(#coin)" stroke="#d99a1b" stroke-width="4"/>
    <text x="450" y="106" font-size="32" font-weight="800" fill="#a7791a" text-anchor="middle">฿</text>

    <!-- ขา -->
    <g fill="#f2aebc" stroke="#e295a6" stroke-width="4">
      <rect x="386" y="292" width="30" height="42" rx="12"/>
      <rect x="484" y="292" width="30" height="42" rx="12"/>
    </g>
    <!-- หู -->
    <path d="M372 168 Q360 120 408 146 Q392 168 372 168 Z" fill="#f4b3c0" stroke="#e295a6" stroke-width="4"/>
    <!-- ลำตัว -->
    <ellipse cx="450" cy="228" rx="122" ry="90" fill="url(#pig)" stroke="#e79eae" stroke-width="5"/>
    <!-- ช่องหยอดเหรียญ -->
    <rect x="426" y="150" width="48" height="13" rx="6" fill="#8a6a4f"/>
    <!-- จมูก -->
    <ellipse cx="452" cy="256" rx="44" ry="33" fill="#f7a9ba" stroke="#e295a6" stroke-width="4"/>
    <ellipse cx="438" cy="256" rx="7" ry="11" fill="#8a6a4f"/>
    <ellipse cx="466" cy="256" rx="7" ry="11" fill="#8a6a4f"/>
    <!-- ตา -->
    <circle cx="486" cy="206" r="10" fill="#4a3626"/>
    <circle cx="490" cy="202" r="3.4" fill="#fff"/>
    <!-- แก้ม -->
    <circle cx="512" cy="240" r="13" fill="#ff9bb0" opacity="0.55"/>
    <!-- หาง -->
    <path d="M566 214 q34 -10 24 20 q-8 24 18 18" fill="none" stroke="#e79eae" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ลูกเต๋า (สื่อเกมกระดาน) -->
  <g transform="translate(632,300) rotate(12)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#fff" stroke="#7a5c43" stroke-width="4"/>
    <g fill="#ff7a59"><circle cx="18" cy="18" r="6"/><circle cx="42" cy="18" r="6"/><circle cx="18" cy="42" r="6"/><circle cx="42" cy="42" r="6"/><circle cx="30" cy="30" r="6"/></g>
  </g>

  <!-- ===== ชื่อเกม ===== -->
  <text x="450" y="440" text-anchor="middle" font-size="86" font-weight="800" fill="#4a3626" letter-spacing="1">วางแผนดี</text>
  <text x="450" y="530" text-anchor="middle" font-size="86" font-weight="800" fill="#ee6a46" letter-spacing="1">ชีวิตมีเงินเก็บ</text>

  <!-- ป้ายคำอธิบาย -->
  <rect x="236" y="566" width="428" height="52" rx="26" fill="#1fa7a0"/>
  <text x="450" y="601" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">เกมวางแผนการเงิน • ระดับมัธยมต้น</text>
</svg>
